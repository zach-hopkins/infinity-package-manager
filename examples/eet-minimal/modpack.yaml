schema: 2

# Measured from the clean Steam 2.6.6 source roots used for the first A5 run.
# These are portable core-layout facts, not machine paths; `iepm execute`
# measures each bound disposable copy again before allowing mutation.
environments:
  bgee-source:
    target: bgee
    version: "2.6.6"
    platform: windows
    language: English
    locale: en_US
    fingerprint:
      profile: iepm-core-layout-v1
      value: 04fc6602150ff7788875573dbf0b7f4aeb7ca26aaf83b022c77d9fc417d848c3
  eet-target:
    # EET executes against BG2EE, then turns this same named workspace into EET.
    target: bg2ee
    after_eet_import: eet
    version: "2.6.6"
    platform: windows
    language: English
    locale: en_US
    fingerprint:
      profile: iepm-core-layout-v1
      value: 298c1d1eb13f7d5f934aaa25f868679a03fd8bfd7f13028b2646e29a4a10ff2f

mods:
  - package: dlc-merger
    environment: bgee-source
    components: [merge-sod]
  - package: ee-fixpack
    environment: bgee-source
    components: [core-fixes]
  - package: ee-fixpack
    environment: eet-target
    components: [core-fixes]
  - package: eet
    environment: eet-target
    components: [core]
    installer_inputs:
      source-environment: bgee-source
  - package: eet-end
    environment: eet-target
    components: [standard]
