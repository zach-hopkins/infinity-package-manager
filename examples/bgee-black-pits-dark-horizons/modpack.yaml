schema: 2

# PA-4 bounded BGEE route. The source's SoD DLC is merged first. Black Pits
# in BG goes early because it overwrites Baeloth/vendor dialogue. Only the
# default quest component of Dark Horizons is selected; its nerfs are optional.
environments:
  target:
    target: bgee
    version: "2.6.6"
    platform: windows
    language: English
    locale: en_US
    fingerprint:
      profile: iepm-core-layout-v1
      value: 04fc6602150ff7788875573dbf0b7f4aeb7ca26aaf83b022c77d9fc417d848c3

mods:
  - package: dlc-merger
    environment: target
    components: [merge-sod]
  - package: bp-in-bg
    environment: target
    components: [black-pits-campaign-access]
  - package: dark-horizons
    environment: target
    components: [dark-horizons-quests]
