schema: 2

# PA-4 bounded main-component route. The source has an unmerged SoD DLC and
# Isra's installer rejects it, so DLC Merger must run first. Optional
# Valerie/Gavin crossmod components need their partner mods and are not chosen.
environments:
  target:
    target: bgee
    version: "2.6.6"
    platform: windows
    language: English
    locale: en_US
    fingerprint:
      profile: iepm-core-layout-v1
      value: 04fc6602150ff7788875573dbf0b7f4aeb7ca26aaf83b022c77d9fc417d848c3

mods:
  - package: dlc-merger
    environment: target
    components: [merge-sod]
  - package: isra-bg1
    environment: target
    components: [isra-bg1-npc]
