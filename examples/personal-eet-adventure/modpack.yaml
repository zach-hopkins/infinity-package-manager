schema: 2

# Current-release equivalent of the supplied deduplicated WeiDU.log.
# This is intentionally a desired build, not a claim that it reproduces every
# file from the historical install. Use fresh, clean BG:EE and BG2:EE sources;
# `iepm build` creates and mutates only disposable IEPM workspaces.
environments:
  bgee-source:
    target: bgee
    version: "2.6.6"
    platform: windows
    language: English
    locale: en_US
  eet-target:
    target: bg2ee
    after_eet_import: eet
    version: "2.6.6"
    platform: windows
    language: English
    locale: en_US

mods:
  - { package: dlc-merger, environment: bgee-source, components: [merge-sod] }
  - { package: ee-fixpack, environment: bgee-source, components: [core-fixes] }
  - { package: ee-fixpack, environment: eet-target, components: [core-fixes] }
  - package: eet
    environment: eet-target
    components: [core]
    installer_inputs: { source-environment: bgee-source }
  - { package: eeex, environment: eet-target, components: [bootstrap, core, luajit] }
  - { package: infinity-ui-plus-plus, environment: eet-target, components: [core] }
  - { package: bubbs-spell-menu, environment: eet-target, components: [main] }
  - { package: hidden-gameplay-options, version: "5.1", environment: eet-target, components: [install-all] }
  - package: call-of-the-lost-goddess
    environment: eet-target
    components: [core-story]
  - package: throne-of-the-mad-god
    environment: eet-target
    components: [core-story]
  - package: ascension
    environment: eet-target
    components:
      - rewritten-final-chapter
      - redeem-balthazar
