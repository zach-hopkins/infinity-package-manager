schema: 2

# Resolver-only coverage request derived from Forge-Mod_Install List.txt.
# It includes only exact existing IEPM package identities. In particular,
# Forge's `stratagems` entry is not silently substituted with `tactics-remix`.
# Component coverage is deliberately bounded to selectors mechanically mapped
# during this bootstrap; the reference list remains a larger future fixture.
environments:
  bgee-source:
    target: bgee
    version: "2.6.6"
    platform: windows
    language: English
    locale: en_US
    fingerprint:
      profile: iepm-core-layout-v1
      value: 04fc6602150ff7788875573dbf0b7f4aeb7ca26aaf83b022c77d9fc417d848c3
  eet-target:
    target: bg2ee
    after_eet_import: eet
    version: "2.6.6"
    platform: windows
    language: English
    locale: en_US
    fingerprint:
      profile: iepm-core-layout-v1
      value: 298c1d1eb13f7d5f934aaa25f868679a03fd8bfd7f13028b2646e29a4a10ff2f

mods:
  # EET's declared source dependency requires an explicit selected component;
  # Forge's list starts after this base prerequisite.
  - package: dlc-merger
    environment: bgee-source
    components: [merge-sod]
  - package: ee-fixpack
    environment: bgee-source
    components: [core-fixes]
  - package: ee-fixpack
    environment: eet-target
    components: [core-fixes]
  - package: eet
    environment: eet-target
    components: [core]
    installer_inputs:
      source-environment: bgee-source
  - package: eeex
    environment: eet-target
    components: [bootstrap, core, luajit]
  - package: infinity-ui-plus-plus
    environment: eet-target
    components: [core]
  - package: bubbs-spell-menu
    environment: eet-target
    components: [main]
  - package: hidden-gameplay-options
    version: "5.1"
    environment: eet-target
    components: [install-all]
  - package: ascension
    environment: eet-target
    components:
      - rewritten-final-chapter
      - redeem-balthazar
      - improved-sarevok-interactions
      - improved-imoen-interactions
      - restored-bhaalspawn-powers
      - improved-slayer-transformation
      - expanded-bioware-epilogues
      - tougher-abazigal
      - tougher-balthazar
      - tougher-demogorgon
      - tougher-gromnir
      - tougher-illasera
      - tougher-yaga-shura
  - package: call-of-the-lost-goddess
    environment: eet-target
    components: [core-story]
  - package: throne-of-the-mad-god
    environment: eet-target
    components: [core-story]
  - package: tweaks-anthology
    # Exact choices from the Forge reference list. The source-tag route carries
    # mechanically-derived selectors for the complete v18 component catalog;
    # compatibility of this particular combination remains unverified.
    environment: eet-target
    components:
      - remove-xp-cap
      - icon-improvements
      - more-interjections
      - alter-wounded-triggers
      - reveal-chapter-six-wilderness
      - reveal-cloakwood-except-mines
      - multiplayer-kickout-dialogue
      - send-npcs-to-inn
      - add-bags-of-holding
      - reveal-city-areas
      - higher-store-stacks
      - thieving-in-heavy-armor
      - expanded-dual-class-options
      - protection-items-pnp
      - item-spells-at-character-level
      - loosen-cleric-multiclass-equipment
      - improved-cure-cause-wounds
      - alternate-concentration-check
      - learn-spells-100-percent
      - potion-stacks-40
      - scroll-stacks-40
      - angry-npcs-never-leave
      - disable-non-hostile-rest-spawns
      - stores-buy-all-items
      - extra-ankheg-armor
      - ammo-recovery-75
      - throwing-recovery-75
      - death-cam
      - reduced-party-chunking
      - movement-casting-speed-100
      - interval-save-30
      - travel-regeneration
      - automatic-ranger-tracking
      - adjust-evil-npc-reactions
      - allow-npc-pairs-to-separate
      - disable-advanced-ai-auto-assignment
  - package: stratagems
    environment: eet-target
    components: [batch-mode, spell-tweaks-batch, initialize-ai, smarter-mages, smarter-priests, ascension-irenicus-sendai, ascension-demons]
  - package: eet-end
    environment: eet-target
    components: [standard]
