        evidence:
          - https://github.com/Gibberlings3/SwordCoastStratagems/releases/tag/v35.21
      - claim: SCS is an optional-component AI/tactical mod; its component-level choices require separate compatibility evidence.
        provenance: declared
        evidence:
          - https://github.com/Gibberlings3/SwordCoastStratagems
      - claim: Batch dispatcher 100 and its selected recording components 2000 (spell tweaks batch), 5900 (initialize AI), 6030 (smarter mages), and 6040 (smarter priests) completed in a fresh IEPM-managed English BG2EE 2.6.6 workspace under shared WeiDU 25100. The exact official EXE was read through the named UnRAR recipe and the completed build was sealed.
        provenance: verified
        evidence:
          - https://github.com/Gibberlings3/SwordCoastStratagems/releases/tag/v35.21
      - claim: In the exact 14-action Forge-derived EET build, SCS's batch dispatcher recorded 2000, 5900, 6030, 6040, 6510 (Improved Fiends and Celestials), 6840, and 6850 (Ascension demons). The run completed and the IEPM build was sealed under shared WeiDU 25100.
        provenance: verified
        evidence:
          - https://github.com/Gibberlings3/SwordCoastStratagems/releases/tag/v35.21
