        evidence:
          - https://github.com/Gibberlings3/Tweaks-Anthology/releases/tag/v18
      - claim: Components 110 (Icon Improvements), 1010 (More Interjections), and 2090 (Remove Experience Cap) completed together in a fresh IEPM-managed English BG2EE 2.6.6 workspace under shared WeiDU 25100. The artifact was fetched into a fresh cache and the completed build was sealed.
