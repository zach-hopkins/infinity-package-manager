      - claim: The exact 0.9.4 author-tag ZIP matched SHA-256. Its TP2 declares VERSION 0.9.3 and seven active LABEL-bearing components; tag and TP2 version are distinct facts, not a hash mismatch.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The author documents SoD-enabled BGEE and EET, recommends an early placement after EET, Endless BG1, and The Calling when present, and warns that Rewriting History conflicts conceptually with Road to Discovery's vanilla-SoD plot tracking. Only Rewriting History triggers the modeled cross-package conflict.
        provenance: declared
        evidence: [https://github.com/subtledoctor/Reflections-of-Destiny]
      - claim: Component 100 forbids Endless BG1 selector 14 and Imoen 4 Ever selector 10. These package-specific overlaps remain under review until those exact release components are mapped.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: Component 330 is EET-only. Four additional component-looking blocks numbered 150, 260, 290, and 320 are commented out in this exact TP2 and are not selectable.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: Component 230 contains an unquoted English sentence in comp_230.tpa line 113. Two independent clean SoD-enabled BGEE 2.6.6 builds failed with the same WeiDU Parsing.Parse_error at that line. The exact release selector is unavailable; the other components are not classified by this failure.
        provenance: verified
        evidence: [evidence/pa4-bgee-reflections-feyr-failure.json]
      - claim: Components 100, 110, 220, and 240 installed into a clean SoD-enabled BGEE 2.6.6 workspace alongside Road to Discovery 6.0 and appeared in WeiDU.log. Four nonfatal patch-search warnings remain visible in the log; game menu and story behavior were not observed.
        provenance: verified
        evidence: [evidence/pa4-bgee-sod-story-valid.json]
