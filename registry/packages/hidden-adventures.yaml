        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The author documents BG2EE and EET support and describes each optional quest or tweak independently. The Silver Dagger import is BGT/EET-only, not a BG2EE selector.
        provenance: declared
        evidence: [https://github.com/Gitjas/hiddenadventure]
      - claim: TP2 selector 5 explicitly requires BGT or EET. The IEPM BG2EE route excludes it; the other ten selectors are offered on BG2EE.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: All ten English BG2EE-facing components completed in a clean BG2EE 2.6.6 build and appeared in WeiDU.log. One nonfatal EXTEND_TOP position warning was retained; menu and gameplay smoke remain unperformed.
        provenance: verified
        evidence: [evidence/pa4-bg2ee-hidden-adventures.json]
