    claims:
      - claim: The exact author v2.2 tag ZIP matched SHA-256. Its TP2 VERSION is v2.2 and all twenty live components have numbered LABEL selectors; commented-out selector 260 is not live.
        provenance: derived
        evidence: [https://github.com/Spellhold-Studios/Infinity-Sounds/releases/tag/v2.2]
      - claim: Selectors 189 and 221 may write to the active USER_DIRECTORY/Baldur.lua outside IEPM's disposable workspace, so they are unavailable until IEPM isolates that side effect. This is an IEPM execution-boundary gap, not a mod incompatibility.
        provenance: derived
        evidence: [https://github.com/Spellhold-Studios/Infinity-Sounds/releases/tag/v2.2]
      - claim: Selector 150 and selector 220 require the original ToB engine and cannot run on the curated EE targets. Selector 160 is for BGEE, while selectors 265 and 270 require BG2EE or EET. The latter also requires English.
        provenance: derived
        evidence: [https://github.com/Spellhold-Studios/Infinity-Sounds/releases/tag/v2.2]
      - claim: Selectors 100 through 140 installed together and were recorded in WeiDU.log in a fresh clean BG2EE 2.6.6 build that sealed. Other choices, menu, gameplay, and EET remain unobserved.
        provenance: verified
        evidence: [evidence/pa4-bg2ee-infinity-sounds.json]
    installers:
