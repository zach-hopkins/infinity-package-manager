      - { id: lich-deril, weidu: { tp2: arestorationp/arestorationp.tp2, label: Almaterias_Restoration_Project-Lich_Deril, number: 6 } }
      - { id: restored-random-encounters, weidu: { tp2: arestorationp/arestorationp.tp2, label: Almaterias_Restoration_Project-Restored_Random_Encounters, number: 7 } }
