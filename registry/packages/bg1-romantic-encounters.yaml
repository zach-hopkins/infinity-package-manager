    claims:
      - claim: >-
          Exact v16 author-tag ZIP matched SHA-256 and TP2 VERSION 16. The
          TP2 declares fifty LABEL-bearing selectors: six mutually exclusive
          style choices numbered 100-105 and forty-four encounters numbered 1-44.
        provenance: derived
        evidence: [docs/pa4-bg1-romantic-encounters-evidence.md]
      - claim: The author documents BGEE and EET use. Individual encounter content and cross-mod behavior remain unverified.
        provenance: declared
        evidence: [https://github.com/Gibberlings3/BG1_Romantic_Encounters]
      - claim: Encounter REQUIRE_FILE predicates depend on marker files produced by one or more of the six style choices. IEPM currently guards mutual exclusion but does not fully preflight those OR-style marker requirements; WeiDU remains authoritative for them.
        provenance: derived
        evidence: [docs/pa4-bg1-romantic-encounters-evidence.md]
      - claim: The adult BG-style/show-warnings choice and all forty-four encounters completed after DLC Merger in a clean BGEE 2.6.6 disposable build and appeared in WeiDU.log. Other style choices, EET, menu, and gameplay remain unobserved.
        provenance: verified
        evidence: [evidence/pa4-bgee-bg1-romantic-encounters.json]
