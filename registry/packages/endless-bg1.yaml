schema: 2
package: endless-bg1
aliases: [c-endlessbg1]
releases:
  - release_id: endless-bg1-v20.2-source
    version: "20.2"
    artifacts:
      - url: https://github.com/Gibberlings3/EndlessBG1/archive/refs/tags/v20.2.zip
        sha256: 2623f4d43a5178acc315c3688cac721877fb8cced9d3fddddc9febd61a6233f4
        platforms: [windows]
    materialization: { source_root: EndlessBG1-20.2, include: ["c#endlessbg1"] }
    compatibility: { games: [bgee, eet] }
    install: { phase: eet, after: [eet], before: [eet-end] }
    provenance: unverified
    claims:
      - claim: The exact v20.2 author-tag ZIP matched SHA-256. Its TP2 declares VERSION 20.2 and seventeen LABEL-bearing components numbered 0 through 16. Two extra BEGIN lines are embedded dialogue scripts, not TP2 selectors.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The author documents BGEE, SoD, and EET support. Main allows remaining in BG1 after Sarevok's defeat; optional components modify the post-finale world and transition.
        provenance: declared
        evidence: [https://github.com/Gibberlings3/EndlessBG1]
      - claim: Every optional component requires the main component; Short Public Hero Tribute also requires More Flavor. Elminster appearances 8 and 9 are TP2 SUBCOMPONENT alternatives.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: Components 2, 10, 11, 14, 15, and 16 need SoD content or EET. An unmerged SoD BGEE source must run DLC Merger before them.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: Sixteen English selectors, choosing the jastey Elminster variant, completed after DLC Merger in a clean BGEE 2.6.6 workspace and appeared in WeiDU.log. Menu, gameplay, alternative Elminster, and EET routes remain unobserved.
        provenance: verified
        evidence: [evidence/pa4-bgee-endless-bg1.json]
    installers:
      - tp2: "c#endlessbg1/c#endlessbg1.tp2"
        launcher: toolchain
        languages:
