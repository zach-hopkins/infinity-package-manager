          - { id: 1, name: Deutsch }
          - { id: 2, name: "Russian (by Austin, Arkie & Arcanecoast.ru)" }
          - { id: 3, name: Polski }
          - { id: 4, name: Francais }
          - { id: 5, name: Italiano }
          - { id: 6, name: Spanish }
          - { id: 7, name: Brazilian Portuguese }
          - { id: 8, name: "Simplified Chinese (translation: Lzw104522773)" }
