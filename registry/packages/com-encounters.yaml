      - { id: improved-druids, weidu: { tp2: com_encounters/SETUP-com_encounters.tp2, label: CoM_Solaufein-improved_druids, number: 1 } }
      - { id: improved-shagbag, weidu: { tp2: com_encounters/SETUP-com_encounters.tp2, label: CoM_Solaufein-improved_shagbag, number: 2 } }
