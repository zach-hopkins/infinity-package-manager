      - claim: The exact v1.22 author-tag ZIP matched SHA-256. Its TP2 declares VERSION v1.22, eight languages, and three LABEL-bearing components numbered 0, 1, and 2.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The TP2's main component requires a ToB, BGT, BG2EE, or EET target. IEPM's current route covers BG2EE and EET; the source readme's generic BGEE wording is not evidence of a supported BGEE installer route.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The author describes the main encounters plus optional Improved Druids and Improved Shagbag components. The latter two are structurally separate selectors and remain Untested.
        provenance: declared
        evidence: [https://github.com/The-Gate-Project/Com_encounters]
      - claim: The exact English main component completed in a clean BG2EE 2.6.6 three-mod quest build and appeared in WeiDU.log. The game menu was not observed because the Windows UI helper failed; this route remains Untested.
        provenance: verified
        evidence: [evidence/pa4-bg2ee-three-quest-expansion.json]
    installers:
      - tp2: com_encounters/SETUP-com_encounters.tp2
        launcher: toolchain
        languages:
          - { id: 0, name: English }
          - { id: 1, name: "Francais (Traduction de Thot des d'Oghmatiques)" }
          - { id: 2, name: "German (Translation by Gerri)" }
          - { id: 3, name: "Italian (Translation by ilot)" }
