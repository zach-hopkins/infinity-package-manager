    provenance: unverified
    claims:
      - claim: The exact official v1.12 tag ZIP matched SHA-256 and declares 65 numeric selectors. EET-only appearance and chapter choices are game-gated; generic XP/gameplay choices also accept BGEE or BG2EE where their TP2 predicates allow it.
        provenance: derived
        evidence: [https://github.com/K4thos/EET_Tweaks/releases/tag/v1.12]
      - claim: Seven custom-value selectors invoke ACTION_READLN and are unavailable until IEPM can record typed portable installer answers. Fixed-value alternatives in the same subcomponent groups remain selectable.
        provenance: derived
        evidence: [https://github.com/K4thos/EET_Tweaks/releases/tag/v1.12]
      - claim: Generic total XP cap choice 2001 installed and sealed on clean BG2EE 2.6.6 without WeiDU warning or skipped component. EET-only choices and EET placement remain untested.
        provenance: verified
        evidence: [evidence/pa4-bg2ee-eet-tweaks.json]
    installers:
