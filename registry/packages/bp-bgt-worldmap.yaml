    claims:
      - claim: Exact author-hosted v13.1.1 tag ZIP matched SHA-256 and has six LABEL-bearing selectors. Main Worldmap can request map size and travel-map answers through ACTION_READLN; IEPM has no portable typed prompt contract, so the main selector is unavailable for unattended execution.
        provenance: derived
        evidence: [https://github.com/SpellholdStudios/BP-BGT-Worldmap/releases/tag/v13.1.1]
      - claim: The two larger worldmap UI layout choices are separate TP2 subcomponents without a declared requirement on main Worldmap. They modify UI.MENU through package-local UI scripts and have no ACTION_READLN or USER_DIRECTORY write in their own sections.
        provenance: derived
        evidence: [https://github.com/SpellholdStudios/BP-BGT-Worldmap/releases/tag/v13.1.1]
      - claim: ToB-map choices require the marker produced by main Worldmap; they are unavailable while main is gated. The savegame updater is excluded on EE engines and would also mutate save directories on classic engines.
        provenance: derived
        evidence: [https://github.com/SpellholdStudios/BP-BGT-Worldmap/releases/tag/v13.1.1]
