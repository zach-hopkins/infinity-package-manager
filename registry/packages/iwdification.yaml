schema: 2
package: iwdification
releases:
  - release_id: iwdification-v11
    version: "v11"
    artifacts:
      - url: https://github.com/Gibberlings3/iwdification/releases/download/v11/iwdification-v11.iemod
        sha256: 4af9d463d3b4afe1e296fe056b6c93e9b6b95e5bcb5541eca81dcbb8ba15db3f
        platforms: [windows]
    materialization:
      source_root: iwdification
    compatibility:
      games: [bgee, bg2ee, eet]
    install:
      phase: eet
    provenance: unverified
    claims:
      - claim: The IEMOD ZIP-family artifact was freshly downloaded from the official v11 release and SHA-256 verified. Its TP2 path, VERSION v11, language-independent selector data, and literal game predicates were mechanically inspected.
        provenance: derived
        evidence:
          - https://github.com/Gibberlings3/iwdification/releases/tag/v11
      - claim: The SCS documentation says its Icewind Dale spell-system component should not be combined with IWDification's corresponding system. IEPM does not encode a package-wide conflict because that overlap is component-specific and has not yet been mapped.
        provenance: declared
        evidence:
          - https://github.com/Gibberlings3/SwordCoastStratagems/blob/master/stratagems/doc/readme-stratagems.html
      - claim: Component 50 (bard songs) completed with Hidden Gameplay Options component 0, Rogue Rebalancing component 0, and Spell Revisions component 0 in a fresh managed English BG2EE 2.6.6 workspace under shared WeiDU 25100.
        provenance: verified
      - claim: The exact v11 TP2 rejects Tweaks Anthology component 70 when selecting IWD casting graphics, and rejects Tweaks component 100 when selecting drab commoners. These are component-level exclusions, not a package-wide incompatibility. The additional named selectors below are mechanically matched but remain installation-untested.
        provenance: derived
        evidence:
          - https://github.com/Gibberlings3/iwdification/releases/tag/v11
    installers:
