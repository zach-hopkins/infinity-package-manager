schema: 2
package: ascalon-questpack
aliases: [ac-quest]
releases:
  - release_id: ascalon-questpack-v7.0-source
    version: "7.0"
    artifacts:
      - url: https://github.com/Gitjas/Ascalons_Questpack/archive/refs/tags/v7.0.zip
        sha256: b6b0ca11925f782afd8db8f7207b63a4160db4a649e245bf606e301cd93af118
        platforms: [windows]
    materialization: { source_root: Ascalons_Questpack-7.0, include: [AC_QUEST] }
    compatibility: { games: [bgee, bg2ee, eet] }
    install: { phase: eet, after: [eet], before: [eet-end, isra-bg1, ajantis-bg1-expansion] }
    provenance: unverified
    claims:
      - claim: The exact v7.0 maintainer-tag ZIP matched SHA-256. Its TP2 declares thirteen LABEL-bearing selectors, including three mutually exclusive pairs of location or story variants.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The maintainer documents BGEE, BG2EE, and EET support; the TP2 limits components 0 through 11 to BG1 targets or EET and component 12 to BG2 targets or EET.
        provenance: declared
        evidence: [https://github.com/Gitjas/Ascalons_Questpack]
      - claim: The author recommends installation before NPC mods. This release is ordered before the already mapped Isra BG1 and Ajantis BG1 Expansion when present; the recommendation is not a hard dependency on either NPC.
        provenance: declared
        evidence: [https://github.com/Gitjas/Ascalons_Questpack]
      - claim: Rabbit-in-cave versus outside, Wolves-in-High-Hedge versus Beregost, and original versus tweaked Serpents are TP2 SUBCOMPONENT alternatives. Only one option from each pair can be selected.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
    installers:
      - tp2: AC_QUEST/ac_quest.TP2
        launcher: toolchain
        languages:
          - { id: 0, name: "Deutsch (German)" }
          - { id: 1, name: English }
          - { id: 2, name: Russian }
          - { id: 3, name: Italian }
