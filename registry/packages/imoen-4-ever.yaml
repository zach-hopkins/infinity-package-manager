          selected_components: [imoen-in-korlasz]
    provenance: unverified
    claims:
      - claim: The exact v11.6 author-tag ZIP matched SHA-256. Its TP2 declares sixteen LABEL-bearing components with stable numbers 0, 1, 2, 3, 9, 10 through 17, 20, 25, and 30.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The author documents BG2EE and SoD/EET routes separately; BG2 chapter-two Imoen returns as the base for the four related BG2 options, while SoD options concern Korlasz and camp return.
        provenance: declared
        evidence: [https://github.com/Gibberlings3/Imoen4Ever]
      - claim: BG2 components 1, 2, 3, and 9 require component 0. SoD components 13, 14, 20, and 25 require component 11. Some other SoD choices accept component 10 OR 11 in the TP2; IEPM does not yet narrow that OR in preflight and leaves those selections unverified unless the user chooses a known-working set.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: SoD portrait choices 16 and 17 are alternatives. Component 10 forbids Endless BG1 Korlasz-dungeon component 14; that narrow cross-package conflict is modeled.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
    installers:
