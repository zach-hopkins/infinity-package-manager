    version: "v11.6"
    artifacts:
      - url: https://github.com/Gibberlings3/Imoen4Ever/archive/refs/tags/v11.6.zip
        sha256: c57fee7058159ee681e77d4c2a80d5a100b6b4adece1d4fadada16fd878593d6
        platforms: [windows]
    materialization: { source_root: Imoen4Ever-11.6, include: [imoen_forever] }
