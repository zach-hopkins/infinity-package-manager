    claims:
      - claim: The exact author v22 tag ZIP was SHA-256 verified; the main TP2 declares VERSION 22, four WeiDU languages, and three LABEL-bearing components numbered 0, 1, and 30.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The author supports BGEE and EET. BG1NPC Project is optional for the main friendship path but should precede this mod when both are installed; it enables additional romance content.
        provenance: declared
        evidence: [https://github.com/Gibberlings3/Ajantis_BG1_Expansion]
      - claim: Shield-art component 1 requires the BG1NPC shield item in the game tree. SoD crossmod component 30 mechanically names ajantisbg1.tp2 component 0 as a prerequisite; how WeiDU resolves that spelling against the main Setup-AjantisBG1.tp2 needs an execution fixture. Both optional choices remain Untested and are not implied by the default selection.
        provenance: derived
        evidence: [https://github.com/Gibberlings3/Ajantis_BG1_Expansion]
      - claim: The main TP2 forbids installation after EET_End. EET target placement after EET import and before EET_End is an IEPM interpretation of that guard and remains Untested.
        provenance: derived
        evidence: [registry/cohorts/pa4-tagged-artifacts.json]
      - claim: The TP2 refuses a BGEE game with an unmerged SoD DLC. The first disposable BGEE 2.6.6 fixture encountered that exact check, so the revised fixture explicitly runs DLC Merger first; a BGEE source without SoD would not need that action.
        provenance: verified
        evidence: [docs/pa4-bgee-ajantis-bg1-expansion-evidence.md]
      - claim: The main English component completed after DLC Merger in a clean IEPM-managed BGEE 2.6.6 build, appeared in WeiDU.log, and the sealed game reached the main menu. Optional shield art, SoD crossmod content, EET, and actual dialogue behavior remain Untested.
        provenance: verified
        evidence: [evidence/pa4-bgee-ajantis-bg1-expansion.json]
    installers:
