[workspace]
members = [
  "crates/iepm-core",
  "crates/iepm-registry",
  "crates/iepm-resolver",
  "crates/iepm-artifacts",
  "crates/iepm-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zach-hopkins/infinity-package-manager"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
semver = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2.0"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
